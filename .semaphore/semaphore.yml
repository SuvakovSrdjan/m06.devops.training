version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Initialize
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run terraform init"
          commands:
            - cd 1-terraform-apply
            - 'terraform init '
            - ls
            - 'artifact push workflow .terraform '
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: Deploy 01
    dependencies:
      - Initialize
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 1-terraform-apply
            - 'artifact pull workflow .terraform '
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: Use the bucket
    dependencies:
      - Deploy 01
    task:
      jobs:
        - name: Run AWS
          commands:
            - cd 1-terraform-apply
            - 'aws s3 cp README.md s3://my-test-bucket/'
            - 'aws s3 ls s3://my-test-bucket'
            - 'aws s3 rm s3://my-test-bucket/README.md'
      secrets:
        - name: localstack
  - name: Destroy
    dependencies:
      - Use the bucket
    task:
      jobs:
        - name: Destroy the artifact
          commands:
            - cd 1-terraform-apply
            - 'artifact pull workflow .terraform '
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull --force workflow terraform.tfstate
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
  - name: Deploy 02
    dependencies:
      - Initialize
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy EC2
          commands:
            - cd 2-terraform-ec2
            - 'artifact pull workflow .terraform '
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - cp terraform.tfstate terraform.tfstate_
            - artifact push workflow terraform.tfstate_
  - name: Destroy 02
    dependencies:
      - Deploy 02
    task:
      jobs:
        - name: Delete all
          commands:
            - cd 2-terraform-ec2
            - 'artifact pull workflow .terraform '
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow --force terraform.tfstate_
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
