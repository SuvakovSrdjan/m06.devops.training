version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Initialize
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run terraform init"
          commands:
            - cd 1-terraform-apply
            - 'terraform init '
            - ls -la
            - 'artifact push workflow .terraform '
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Initialize
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 1-terraform-apply
            - ls
            - 'artifact pull workflow .terraform '
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
